name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            cmake \
            ccache \
            build-essential \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            ant

          autoreconf --version
          autoconf --version
          automake --version
          libtool --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      - name: Configure Buildozer
        run: |
          grep -v '^p4a.branch' buildozer.spec > buildozer.spec.tmp
          mv buildozer.spec.tmp buildozer.spec

          cat >> buildozer.spec <<'EOF'

          p4a.branch = develop
          android.accept_sdk_license = True
          EOF

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          autoreconf --version
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FB-YT-Bot-APK
          path: bin/*.apk
          if-no-files-found: error

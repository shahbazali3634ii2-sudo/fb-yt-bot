---
format_version: '26'

default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: other

workflows:
  primary:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'

    - git-clone@8: {}

    - script@1:
        title: Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-pip \
              python3-venv \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev

    - script@1:
        title: Install Buildozer
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e

            cd "$BITRISE_SOURCE_DIR"

            python3 -m venv .venv

            source .venv/bin/activate

            python -m pip install --upgrade pip setuptools wheel

            python -m pip install buildozer cython==0.29.36

            buildozer --version

    - script@1:
        title: Build APK
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e

            cd "$BITRISE_SOURCE_DIR"

            source .venv/bin/activate

            if [ ! -f "buildozer.spec" ]; then
              echo "ERROR: buildozer.spec not found"
              exit 1
            fi

            if [ ! -f "main.py" ]; then
              echo "ERROR: main.py not found"
              exit 1
            fi

            buildozer -v android debug

    - script@1:
        title: Prepare APK
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e

            mkdir -p "$BITRISE_DEPLOY_DIR"

            APK_FILE=$(find "$BITRISE_SOURCE_DIR/bin" -type f -name "*.apk" | head -n 1)

            if [ -z "$APK_FILE" ]; then
              echo "ERROR: APK was not generated"
              exit 1
            fi

            cp "$APK_FILE" "$BITRISE_DEPLOY_DIR/FB-YT-Bot-debug.apk"

            echo "APK successfully prepared:"
            ls -lh "$BITRISE_DEPLOY_DIR/FB-YT-Bot-debug.apk"

    - deploy-to-bitrise-io@2: {}

    triggers:
      push:
      - branch: main

      pull_request:
      - source_branch: "*"

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: elite
